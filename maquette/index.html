<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout : une pièce isométrique en pixel art au centre (comme une chambre d'hôtel Habbo), une fenêtre d'info à droite, la barre d'outils en bas. Univers assumé : une seule ambiance, nuit bleue + fenêtres claires. */
:root {
  --night: #0f1d2e;        /* fond autour des pièces */
  --night-2: #172a40;      /* barres */
  --chrome: #1e5a8c;       /* en-têtes de fenêtres */
  --panel: #edf0f3;        /* corps des fenêtres */
  --panel-2: #dfe4ea;      /* lignes, champs */
  --ink: #142030;          /* texte */
  --muted: #586777;        /* texte secondaire */
  --coin: #ffc933;         /* action principale, récompenses */
  --go: #2b9a4c;           /* fait, disponible */
  --alert: #d9402f;        /* retard, bloqué */
  --violet: #7a5ad8;       /* réunion */
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Ubuntu", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { color: inherit; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--coin); outline-offset: 2px; }
.app { min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(132px + env(safe-area-inset-bottom, 0px)); gap: 12px; max-width: 1280px; margin: 0 auto; }

/* En-tête */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; color: #e8eef5; }
.logo { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.logo i { width: 14px; height: 14px; background: var(--coin); box-shadow: 4px 4px 0 #c8231b; display: inline-block; }
.room-title { font-family: var(--display); font-size: 16px; color: #9fb6cc; }
.demo-tag { margin-left: auto; font-size: 12px; color: #9fb6cc; border: 1px dashed #3d5876; padding: 3px 8px; border-radius: 4px; }
.presence { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--night-2); color: #dbe6f1; border: 1px solid #2b4560; border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 12px; cursor: pointer; }
.chip .dot { width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; font-family: var(--display); font-size: 11px; color: #fff; }
.chip b { font-weight: 500; }

/* Scène */
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 12px; align-items: start; }
.stage-wrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stage { position: relative; width: 100%; background: radial-gradient(ellipse at 50% 40%, #1d3550, var(--night) 70%); border: 2px solid #2b4560; border-radius: 10px; overflow: hidden; touch-action: manipulation; }
.stage canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; margin: 0 auto; cursor: pointer; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.tag { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 11px; color: #fff; background: rgba(15, 29, 46, .78); border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
.tag.floor { background: rgba(255, 255, 255, .85); color: var(--ink); }
.tag.name { transform: translate(-50%, -100%); }
.chatlog { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
.bubble { max-width: min(92%, 460px); background: #fff; color: var(--ink); border: 2px solid #142030; border-radius: 8px; padding: 3px 8px 3px 4px; font-size: 12.5px; display: flex; gap: 6px; align-items: flex-start; box-shadow: 0 2px 0 rgba(0,0,0,.35); animation: rise .25s ease-out; }
.bubble .who { flex: none; width: 16px; height: 16px; border-radius: 3px; margin-top: 1px; }
.bubble b { font-weight: 700; }
.bubble.sys { background: #fff7d6; }
.bubble.old { opacity: .55; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.room-hint { color: #9fb6cc; font-size: 12.5px; }
.objects { display: flex; flex-wrap: wrap; gap: 6px; }
.objects button { background: var(--night-2); color: #dbe6f1; border: 1px solid #2b4560; border-radius: 6px; padding: 4px 9px; font-size: 12.5px; cursor: pointer; min-height: 32px; }
.objects button:hover { border-color: var(--coin); }

/* Fenêtres façon Habbo */
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.win { background: var(--panel); border: 2px solid #0b1522; border-radius: 8px; box-shadow: 0 3px 0 rgba(0,0,0,.4); overflow: hidden; min-width: 0; }
.win > h2 { margin: 0; background: var(--chrome); color: #fff; font-family: var(--display); font-weight: 600; font-size: 15px; padding: 5px 10px; display: flex; align-items: center; gap: 8px; }
.win > h2 .x { margin-left: auto; background: #c8452f; border: 1px solid #6e1d12; color: #fff; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-family: var(--display); line-height: 1; }
.win .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.win h3 { margin: 0; font-size: 16px; text-wrap: balance; }
.win p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; border: 1px solid; }
.pill.todo { color: #3c4a5a; border-color: #a9b5c2; background: #fff; }
.pill.doing { color: #1d5d9b; border-color: #8db7e2; background: #eaf3fc; }
.pill.done { color: #1d6b3a; border-color: #8fd0a4; background: #e8f7ed; }
.pill.blocked, .pill.late { color: #a5291c; border-color: #eba59b; background: #fdecea; }
.pill.meet { color: #4f35a8; border-color: #c2b2f0; background: #f2eefd; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 8px; align-items: center; background: #fff; color: var(--ink); border: 1px solid var(--panel-2); border-radius: 6px; padding: 7px 8px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .s { font-size: 12px; color: var(--muted); }
.mini { width: 22px; height: 22px; border-radius: 4px; flex: none; display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 2px solid #0b1522; border-bottom-width: 3px; background: #fff; color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 500; min-height: 36px; }
.btn.main { background: var(--coin); }
.btn.go { background: #bfe8cb; }
.btn.warn { background: #ffd9d3; }
.btn:active { transform: translateY(1px); border-bottom-width: 2px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.slot { border: 2px dashed #a9b5c2; border-radius: 6px; min-height: 54px; padding: 5px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; background: #fff; }
.slot.full { border-style: solid; border-color: #8db7e2; }
.slot.blocked { border-color: #eba59b; background: #fff4f2; }
.slots:has(> :nth-child(4)) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bar { height: 10px; background: #fff; border: 2px solid #0b1522; border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--go); }
.bar.hot > i { background: var(--alert); }
.bar.mid > i { background: var(--coin); }
.mission { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.mission .box { flex: none; width: 16px; height: 16px; border: 2px solid #0b1522; border-radius: 3px; margin-top: 2px; background: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 12px; color: #fff; }
.mission.ok .box { background: var(--go); }
.mission.ok span { color: var(--muted); text-decoration: line-through; }
.feed { max-height: 220px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.feed .row { padding: 5px 7px; font-size: 12.5px; }
textarea.note { width: 100%; min-height: 64px; border: 2px solid #0b1522; border-radius: 6px; padding: 6px; font: inherit; resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 13px; }
select.inp, input.inp { border: 2px solid #0b1522; border-radius: 6px; padding: 5px 8px; min-height: 36px; background: #fff; color: var(--ink); }

/* Barre du bas : chat + outils */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--night-2); border-top: 2px solid #0b1522; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.dock-in { max-width: 1280px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 8px; }
.chat { display: flex; gap: 6px; }
.chat select { flex: none; max-width: 40%; }
.chat input { flex: 1; min-width: 0; }
.tools { display: flex; gap: 6px; overflow-x: auto; }
.tool { flex: none; display: inline-flex; align-items: center; gap: 6px; background: #22405f; color: #fff; border: 2px solid #0b1522; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-family: var(--display); font-size: 14px; min-height: 40px; position: relative; }
.tool:hover { background: #2a5078; }
.tool svg { width: 18px; height: 18px; shape-rendering: crispEdges; }
.tool .count { background: var(--alert); color: #fff; font-family: var(--body); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 6px; }

/* Fenêtre modale (navigateur, main, quêtes) */
.modal { position: fixed; z-index: 30; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 24px)); max-height: min(78vh, 680px); display: flex; flex-direction: column; }
.modal .body { overflow: auto; }
.scrim { position: fixed; inset: 0; z-index: 25; background: rgba(5, 10, 18, .55); }
.toasts { position: fixed; z-index: 40; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100vw - 24px)); pointer-events: none; }
.toast { background: var(--panel); border: 2px solid #0b1522; border-left: 8px solid var(--coin); border-radius: 6px; padding: 8px 10px; box-shadow: 0 3px 0 rgba(0,0,0,.4); animation: rise .25s ease-out; font-size: 13px; }
.toast b { display: block; font-family: var(--display); font-size: 14px; }
.nav-room { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #fff; color: var(--ink); border: 1px solid var(--panel-2); border-radius: 6px; padding: 8px; cursor: pointer; }
.nav-room:hover { border-color: var(--chrome); }
.nav-room .ic { width: 34px; height: 34px; border-radius: 6px; flex: none; }
.nav-room .grow { flex: 1; min-width: 0; }
.nav-room .s { font-size: 12px; color: var(--muted); }
.sect { font-family: var(--display); font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .demo-tag { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .bubble, .toast { animation: none; } }
</style>

/* --- Particules --- */
function spawn(gx, gy, z, kind) {
  if (reduceMotion) return;
  const [x, y] = iso(gx, gy, z);
  if (kind === "confetti") for (let i = 0; i < 24; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 3 - 1, life: 50, c: ["#ffc933", "#d9402f", "#2b9a4c", "#2f6fd6"][i % 4], g: 0.12, s: 2 });
  else particles.push({ x: x + (Math.random() - 0.5) * 6, y, vx: (Math.random() - 0.5) * 0.3, vy: -0.4, life: 40, c: kind === "smoke" ? "rgba(70,70,80,.55)" : "rgba(255,255,255,.7)", g: 0, s: kind === "smoke" ? 4 : 3 });
}

/* ========================================================================
   Boucle : mise en page, rendu, clics, déplacements
   ======================================================================== */
let me = { id: ME, who: ME, x: 1, y: 4, path: [] };
let currentRoomId = "chambre-johan";
let avatarsLive = [];

function enterRoom(id, opts = {}) {
  currentRoomId = id;
  buildRooms();
  room = ROOMS[id];
  const [cols, rows] = room.size;
  // la toile épouse la pièce : elle remplit la scène quelle que soit sa taille
  W = Math.round((cols + rows) * TW / 2 + 70);
  H = Math.round((cols + rows) * TH / 2 + WH + 96);
  cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
  OX = Math.round(W / 2 - (cols - rows) * TW / 4);
  OY = Math.round(WH + 62);
  me = { id: ME, who: ME, x: room.entry[0], y: room.entry[1], path: [] };
  avatarsLive = room.avatars.map((a) => ({ ...a, path: [] }));
  document.getElementById("roomTitle").textContent = room.name;
  document.getElementById("roomHint").textContent = room.hint;
  cv.setAttribute("aria-label", room.name + ". " + room.hint);
  fit();
  if (!opts.keepSelection) { selected = null; renderInfo(); }
  renderObjects();
  renderPresence();
  layoutTags();
  if (room.kind === "project" && S.tasks.some((t) => t.project === room.project && t.status === "done" && t.justDone)) mission("build");
}
function refreshRoom() {
  // reconstruit la pièce sans déplacer les avatars présents
  const keep = new Map(avatarsLive.map((a) => [a.id, a]));
  buildRooms();
  room = ROOMS[currentRoomId];
  avatarsLive = room.avatars.map((a) => {
    const old = keep.get(a.id);
    return old && !a.forceMove ? { ...a, x: old.x, y: old.y, path: old.path, targetX: a.x, targetY: a.y } : { ...a, path: [] };
  });
  avatarsLive.forEach((a) => { if (a.targetX != null && (Math.round(a.x) !== a.targetX || Math.round(a.y) !== a.targetY)) walkTo(a, a.targetX, a.targetY); });
  renderObjects();
  renderPresence();
  layoutTags();
}

function fit() {
  const stage = document.getElementById("stage");
  const avail = stage.clientWidth - 4;
  const maxH = Math.max(280, window.innerHeight * 0.6);
  let s = Math.min(avail / W, maxH / H);
  if (s >= 2) s = Math.floor(s * 2) / 2;
  scale = s;
  cv.style.width = Math.round(W * s) + "px";
  cv.style.height = Math.round(H * s) + "px";
  layoutTags();
}

function blocked() {
  const [cols, rows] = room.size;
  const g = Array.from({ length: cols }, () => Array(rows).fill(false));
  room.items.forEach((it) => (it.blocks || []).forEach(([x, y]) => { if (g[x] && y < rows) g[x][y] = true; }));
  avatarsLive.forEach((a) => { const x = Math.round(a.x), y = Math.round(a.y); if (g[x] && y >= 0 && y < rows) g[x][y] = true; });
  return g;
}
function findPath(fx, fy, tx, ty) {
  const [cols, rows] = room.size;
  const g = blocked();
  if (tx < 0 || ty < 0 || tx >= cols || ty >= rows || g[tx][ty]) return null;
  const key = (x, y) => x + "," + y;
  const prev = new Map([[key(fx, fy), null]]);
  const q = [[fx, fy]];
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || g[nx][ny] || prev.has(key(nx, ny))) continue;
      prev.set(key(nx, ny), [x, y]); q.push([nx, ny]);
    }
  }
  if (!prev.has(key(tx, ty))) return null;
  const path = [];
  for (let c = [tx, ty]; c && !(c[0] === fx && c[1] === fy); c = prev.get(key(c[0], c[1]))) path.unshift(c);
  return path;
}
function walkTo(a, tx, ty) {
  const p = findPath(Math.round(a.x), Math.round(a.y), tx, ty) || [[tx, ty]];
  a.path = p;
  if (reduceMotion && p.length) { const last = p[p.length - 1]; a.x = last[0]; a.y = last[1]; a.path = []; }
}
function stepAvatar(a, dt) {
  if (!a.path || !a.path.length) return;
  const [tx, ty] = a.path[0];
  const sp = 3.2 * dt;
  const dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy);
  if (dist <= sp) { a.x = tx; a.y = ty; a.path.shift(); if (!a.path.length && a.onArrive) { const f = a.onArrive; a.onArrive = null; f(); } }
  else { a.x += (dx / dist) * sp; a.y += (dy / dist) * sp; }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  hits = [];
  drawRoomShell();
  // éléments muraux
  (room.wall_items || []).forEach((it) => {
    const bb = WALLITEM[it.type](it);
    if (it.ref && bb) hits.push({ bb, ref: it.ref, depth: -1, label: labelFor(it.ref) });
  });
  // objets + avatars triés par profondeur
  const ents = [];
  room.items.forEach((it) => ents.push({ d: it.type === "rug" ? -2 : it.x + it.y + (it.type === "bed" ? 3 : it.type === "desk" ? 1.5 : 1), draw: () => FURNI[it.type](it), ref: it.ref }));
  avatarsLive.concat([me]).forEach((a) => ents.push({ d: a.x + a.y + 1.2, draw: () => drawAvatar(a), ref: a.ref || (a.who ? { kind: "person", who: a.who } : null) }));
  ents.sort((a, b) => a.d - b.d).forEach((e) => {
    const bb = e.draw();
    if (e.ref && bb) hits.push({ bb, ref: e.ref, depth: e.d, label: labelFor(e.ref) });
  });
  // surbrillance du survol / de la sélection
  for (const h of hits) {
    if ((hover && sameRef(h.ref, hover)) || (selected && sameRef(h.ref, selected))) {
      ctx.strokeStyle = selected && sameRef(h.ref, selected) ? "#ffc933" : "rgba(255,255,255,.8)";
      ctx.setLineDash([3, 2]); ctx.lineWidth = 1;
      ctx.strokeRect(h.bb[0] - 2.5, h.bb[1] - 2.5, h.bb[2] - h.bb[0] + 5, h.bb[3] - h.bb[1] + 5);
      ctx.setLineDash([]);
    }
  }
  // particules
  particles.forEach((p) => { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); });
}
const sameRef = (a, b) => a && b && a.kind === b.kind && a.id === b.id && a.who === b.who && a.to === b.to;

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; tick++;
  avatarsLive.concat([me]).forEach((a) => stepAvatar(a, dt));
  particles.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; });
  particles = particles.filter((p) => p.life > 0);
  draw();
  if (tick % 6 === 0) layoutTags();
  requestAnimationFrame(loop);
}

function toLogical(ev) {
  const r = cv.getBoundingClientRect();
  return [(ev.clientX - r.left) * (W / r.width), (ev.clientY - r.top) * (H / r.height)];
}
function pick(x, y) {
  const found = hits.filter((h) => x >= h.bb[0] - 2 && x <= h.bb[2] + 2 && y >= h.bb[1] - 2 && y <= h.bb[3] + 2);
  found.sort((a, b) => b.depth - a.depth);
  return found[0] || null;
}
cv.addEventListener("mousemove", (ev) => { const [x, y] = toLogical(ev); const h = pick(x, y); hover = h ? h.ref : null; cv.title = h ? h.label : ""; });
cv.addEventListener("mouseleave", () => { hover = null; });
cv.addEventListener("click", (ev) => {
  const [x, y] = toLogical(ev);
  const h = pick(x, y);
  if (h) { select(h.ref); return; }
  // sinon : se déplacer sur la case visée
  const dx = (x - OX) / (TW / 2), dy = (y - OY) / (TH / 2);
  const gx = Math.floor((dx + dy) / 2), gy = Math.floor((dy - dx) / 2);
  walkTo(me, gx, gy);
});

/* --- Étiquettes DOM (zones, noms) --- */
function layoutTags() {
  const ov = document.getElementById("overlay");
  if (!room) return;
  const r = cv.getBoundingClientRect(), sr = document.getElementById("stage").getBoundingClientRect();
  const offX = r.left - sr.left, offY = r.top - sr.top;
  const k = r.width / W;
  const tags = [];
  (room.zones || []).forEach((z) => {
    const [x, y] = iso(z.x + z.w / 2, z.y + z.d - 0.25);
    const extra = room.kind === "project" ? lotProgress(room.project, z.label) : "";
    tags.push(`<span class="tag floor" style="left:${offX + x * k}px;top:${offY + y * k}px">${esc(z.label)}${extra}</span>`);
  });
  avatarsLive.concat([me]).forEach((a) => {
    const [x, y] = iso(a.x + 0.5, a.y + 0.5);
    const focused = a.ref && ((hover && sameRef(a.ref, hover)) || (selected && sameRef(a.ref, selected)));
    const name = a.who ? PEOPLE[a.who].name : !focused ? "" : a.ref.kind === "opp" ? oppById(a.ref.id).client : a.ref.kind === "signal" ? sigById(a.ref.id).client : "";
    if (name) tags.push(`<span class="tag name" style="left:${offX + x * k}px;top:${offY + (y - 50) * k}px">${esc(name)}</span>`);
  });
  ov.innerHTML = tags.join("");
}
function lotProgress(pid, lot) {
  const ts = S.tasks.filter((t) => t.project === pid && t.lot === lot);
  return ts.length ? ` · ${ts.filter((t) => t.status === "done").length}/${ts.length}` : "";
}

  S.help.filter((h) => h.who !== ME && h.status === "open").forEach((h) => items.push({ sev: 2, text: `${PEOPLE[h.who].name} demande un coup de main`, sub: h.text, go: { room: "commune", ref: { kind: "standup" } } }));

function questList() {

let pendingPlace = null;
const ACT = {
  place(id, _to, override) {

    save(); refreshRoom(); renderAll();
  },
  finish(id) {
    const t = taskById(id);
    t.status = "done"; t.justDone = true; t.stale = 0; S.doneThisWeek++; if (t.owner) S.load[t.owner] = Math.max(0, S.load[t.owner] - 6);
    log(`${PEOPLE[t.owner].name} termine « ${t.title} ».`, t.owner);
    toast("Tâche terminée", `« ${t.title} » rejoint la salle projet sous forme de meuble. Quête « Finir 8 tâches » : ${Math.min(8, S.doneThisWeek)}/8.`);
    say(t.owner, `C'est fait : ${t.title}.`);
    if (currentRoomId === t.project) spawn(2, 2, 30, "confetti");

    const lotLeft = S.tasks.filter((x) => x.project === t.project && x.lot === t.lot && x.status !== "done").length;
    if (!lotLeft) { toast("Clap de fin", `Le lot « ${t.lot} » de ${PROJECTS[t.project].name} est terminé.`); log(`Lot « ${t.lot} » terminé.`, null); }
    checkQuests(); save(); refreshRoom(); renderAll();
  },
  unplace(id) { const t = taskById(id); t.status = "todo"; log(`Johan repose « ${t.title} » dans sa main.`, ME); save(); refreshRoom(); renderAll(); },
  help(id) {
    const t = taskById(id);
    if (S.help.some((h) => h.task === id && h.status === "open")) return toast("Déjà demandé", "Ta demande est affichée dans la salle commune.");
    S.help.push({ id: "help" + Date.now(), who: ME, task: id, text: `Bloqué sur « ${t.title} » : ${t.reason || "besoin d'un avis"}`, status: "open" });
    log(`Johan demande un coup de main sur « ${t.title} ».`, ME);

    after(3200, () => {

      log("Charles prend la demande d'aide sur « Key visual ».", "charles");
    });
  },
  unblock(id) { const t = taskById(id); t.status = "doing"; t.reason = null; log(`« ${t.title} » est débloquée.`, ME); toast("Débloquée", `« ${t.title} » repasse en cours.`); checkQuests(); save(); refreshRoom(); renderAll(); },
  handoff(id, to, note) {
    const t = taskById(id);
    S.handoffs.push({ id: "h" + Date.now(), from: ME, to, task: id, note: note || `Tu peux prendre « ${t.title} » ?`, status: "pending" });
    log(`Johan propose « ${t.title} » à ${PEOPLE[to].name} (post-it).`, ME);
    toast("Post-it déposé", `Sur le mur de ${PEOPLE[to].name}. ${S.presence[to].state === "focus" ? "Il est en focus : pas de notification, il le verra à la fin de sa session." : "Il reçoit une notification."}`);
    if (to === "pierre") mission("handoff");

    after(4200, () => {
      const h = S.handoffs.find((x) => x.task === id && x.to === to && x.status === "pending"); if (!h) return;
      h.status = "accepted"; t.owner = to;
      say(to, `Je prends « ${t.title} ». (réponse simulée)`);
      log(`${PEOPLE[to].name} accepte « ${t.title} ».`, to);

  accept(hid) {

function checkQuests() {
  const before = S.badges || [];

  done.filter((b) => !before.includes(b)).forEach((b) => toast("Badge d'équipe", `« ${b} » : bien joué, ensemble.`));
  S.badges = Array.from(new Set(before.concat(done)));
}

  } else if (r.kind === "opp") {

      if (t.status === "blocked") acts = B("Demander de l'aide", "help", { id: t.id }, "main") + B("C'est débloqué", "unblock", { id: t.id }, "go");

    else if (t.status !== "done") acts = B("Proposer mon aide", "offer", { id: t.id });
    html = `<h3>${esc(t.title)}</h3>${taskRow(t, acts)}<p class="small muted">${t.status === "done" ? "Terminée : la caisse est devenue un meuble de la salle projet." : "Ouvre la fiche complète dans l'app pour les commentaires, le temps et les dépendances."}</p>`;

    const list = pid ? [pid] : Object.keys(PROJECTS).filter((id) => S.tasks.some((t) => t.project === id && t.owner === r.who && t.status !== "done"));
    html = `<h3>${pid ? esc(PROJECTS[pid].name) : "Projets de " + esc(PEOPLE[r.who].name)}</h3><div class="rows">${list.map((id) => { const ts = S.tasks.filter((t) => t.project === id); const d = ts.filter((t) => t.status === "done").length; return `<button type="button" class="nav-room" data-room="${id}"><span class="ic" style="background:${PROJECTS[id].floor[1]}"></span><span class="grow"><b>${esc(PROJECTS[id].name)}</b><span class="s"> · ${esc(PROJECTS[id].client)}</span><div class="bar" style="margin-top:4px"><i style="width:${Math.round((d / ts.length) * 100)}%"></i></div></span></button>`; }).join("")}</div>`;
    box.innerHTML = html; bindRooms(box); return;
  } else if (r.kind === "pipeline") {
    html = `<h3>Pipeline</h3><div class="rows">${STAGES.map((s, i) => { const os = S.opps.filter((o) => o.stage === i); return `<div class="row"><div class="grow"><div class="t">${s} (${os.length})</div><div class="s">${os.map((o) => esc(o.client)).join(", ") || "—"}</div></div><b>${money(os.reduce((n, o) => n + o.amount, 0))}</b></div>`; }).join("")}</div>`;
  }
  box.innerHTML = html; bindActions(box);
}
function renderDesk(who) {

  const slots = Array.from({ length: Math.max(WIP, d.length) }, (_, i) => d[i]);

  return `<h3>${mine ? "Mon bureau" : "Bureau de " + esc(PEOPLE[who].name)} · ${d.length}/${WIP}</h3>
  <div class="slots">${slots.map((t) => t ? `<div class="slot full ${t.status === "blocked" ? "blocked" : ""}"><b>${esc(t.title)}</b><span class="muted">${t.status === "blocked" ? "Bloquée" : "En cours"}</span></div>` : '<div class="slot"><span class="muted">Place libre</span></div>').join("")}</div>
  ${waiting ? `<div class="row" style="border-color:#eba59b;background:#fff4f2"><div class="grow"><div class="t">Bureau plein pour « ${esc(waiting.title)} »</div><div class="s">Termine ou repose une tâche ci-dessous. Si c'est vraiment urgent, dépasse la limite en le justifiant (visible dans le fil).</div><div class="actions" style="margin-top:6px"><input class="inp" id="ovReason" maxlength="120" placeholder="Motif (ex. demande client urgente)" aria-label="Motif du dépassement" style="flex:1;min-width:0"><button type="button" class="btn warn" id="ovGo">Dépasser</button></div></div></div>` : ""}
  ${mine ? `<div class="rows">${d.map((t) => taskRow(t, t.status === "blocked" ? B("Demander de l'aide", "help", { id: t.id }, "main") + B("C'est débloqué", "unblock", { id: t.id }, "go") + B("Reposer", "unplace", { id: t.id }) : B("Terminer", "finish", { id: t.id }, "go") + B("Je suis bloqué", "block", { id: t.id }, "warn"))).join("")}</div>
  <div class="actions">${B("Ouvrir ma main (" + tasksOf(ME, ["todo"]).length + ")", "openHand", {}, "main")}</div>
  <p class="small muted">3 places, pas une de plus : une tâche bloquée occupe une place tant qu'elle n'est pas débloquée ou reposée. C'est ce qui nous fait finir.</p>` : ""}`;

function renderPresenceForm() {

function renderQuests() {

function bindActions(root) {
  const ov = root.querySelector("#ovGo");
  ov && ov.addEventListener("click", () => {
    const r = root.querySelector("#ovReason").value.trim();
    if (!r) { root.querySelector("#ovReason").focus(); return toast("Motif requis", "Dis en quelques mots pourquoi tu dépasses la limite de 3."); }
    ACT.place(pendingPlace, null, r);
  });
  root.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
    const a = b.dataset.act, args = JSON.parse(b.dataset.args || "{}");
    if (a === "openHand") return openModal("hand");
    if (a === "compose") return openModal("compose", args);
    if (a === "composeTo") return openModal("compose", { to: args.who });
    if (a === "block") { const t = taskById(args.id); t.status = "blocked"; t.reason = "À préciser dans le stand-up"; log(`« ${t.title} » est bloquée.`, ME); save(); refreshRoom(); renderAll(); return; }
    if (a === "offer") { const t = taskById(args.id); log(`Johan propose son aide à ${PEOPLE[t.owner].name} sur « ${t.title} ».`, ME); toast("Aide proposée", `${PEOPLE[t.owner].name} trouvera ta proposition sur son mur.`); return; }
    if (a === "visio") return toast("Visio", "Dans l'app, ce bouton ouvre le lien Meet de l'événement du calendrier.");
    if (a === "cr") return toast("Compte rendu", "Dans l'app, ce bouton ouvre « Nouveau compte rendu », prérempli depuis la réunion : les lignes « [ ] » deviennent des tâches.");
    if (a === "accept" || a === "decline") return ACT[a](args.id);
    ACT[a](args.id, args.to);
  }));
}
function bindRooms(root) { root.querySelectorAll("[data-room]").forEach((b) => b.addEventListener("click", () => { closeModal(); enterRoom(b.dataset.room); })); }

/* --- Modales : navigateur, main, post-it, quêtes, présence --- */
let lastFocus = null;
function openModal(kind, args = {}) {
  lastFocus = document.activeElement;
  const title = document.getElementById("modalTitle"), body = document.getElementById("modalBody");
  if (kind === "nav") {
    title.textContent = "Navigateur";
    const roomsList = [
      ["Ma chambre", "chambre-johan", PEOPLE.johan.shirt, `Bureau ${deskOf(ME).length}/3 · ${S.handoffs.filter((h) => h.to === ME && h.status === "pending").length} post-it`],
      ["Salle commune", "commune", "#caa576", `Brief : ${briefItems().length} points · stand-up`],
      ["Hall clients", "hall", "#adbac7", `${S.opps.length} opportunités · ${S.opps.filter((o) => o.late).length} en retard · ${S.signals.length} à la porte`],
      ["Chambre de Charles", "chambre-charles", PEOPLE.charles.shirt, shownShort("charles")],
      ["Chambre de Pierre", "chambre-pierre", PEOPLE.pierre.shirt, shownShort("pierre")],
    ];
    body.innerHTML = `<p class="sect">Le QG</p>${roomsList.map(([n, id, c, s]) => `<button type="button" class="nav-room" data-room="${id}"><span class="ic" style="background:${c}"></span><span class="grow"><b>${esc(n)}</b><div class="s">${esc(s)}</div></span></button>`).join("")}
      <p class="sect">Salles projets</p>${Object.entries(PROJECTS).map(([id, p]) => { const ts = S.tasks.filter((t) => t.project === id); const d = ts.filter((t) => t.status === "done").length; const bl = ts.filter((t) => t.status === "blocked").length; return `<button type="button" class="nav-room" data-room="${id}"><span class="ic" style="background:${p.floor[1]}"></span><span class="grow"><b>${esc(p.name)}</b><div class="s">${esc(p.client)} · ${d}/${ts.length} tâches finies${bl ? ` · ${bl} bloquée` : ""}</div></span></button>`; }).join("")}`;
    bindRooms(body);
  } else if (kind === "hand") {
    title.textContent = "Ma main";
    const hand = tasksOf(ME, ["todo"]);
    body.innerHTML = `<p class="small muted">Les tâches qui t'attendent. Pose-en une sur ton bureau (${deskOf(ME).length}/3) ou passe-la à un associé.</p><div class="rows">${hand.map((t) => taskRow(t, B("Poser sur mon bureau", "place", { id: t.id }, "main") + B("Passer à…", "compose", { id: t.id }))).join("") || '<p class="muted">Ta main est vide.</p>'}</div>`;
    bindActions(body);
  } else if (kind === "compose") {
    title.textContent = "Déposer un post-it";
    const mine = tasksOf(ME, ["todo", "doing"]);
    const tid = args.id || (mine[0] && mine[0].id);
    const to = args.to || (args.id ? (taskById(args.id).project === "p1" ? "pierre" : "charles") : "pierre");
    body.innerHTML = `<label class="field">Tâche<select class="inp" id="cTask">${mine.map((t) => `<option value="${t.id}"${t.id === tid ? " selected" : ""}>${esc(t.title)}</option>`).join("")}</select></label>
      <label class="field">Pour<select class="inp" id="cTo">${Object.keys(PEOPLE).filter((w) => w !== ME).map((w) => `<option value="${w}"${w === to ? " selected" : ""}>${PEOPLE[w].name} · ${S.load[w]} % · ${shownShort(w)}</option>`).join("")}</select></label>
      <label class="field">Un mot (facultatif)<textarea class="note" id="cNote" maxlength="200" placeholder="Pourquoi lui, pour quand, ce qui est déjà fait…"></textarea></label>
      <div class="actions"><button type="button" class="btn main" id="cSend">Déposer le post-it</button></div>
      <p class="small muted">La tâche ne change de main que si l'autre accepte. Personne n'est mis devant le fait accompli.</p>`;
    document.getElementById("cSend").addEventListener("click", () => ACT.handoff(document.getElementById("cTask").value, document.getElementById("cTo").value, document.getElementById("cNote").value.trim()));
  } else if (kind === "wall") {
    closeModal(); enterRoom("chambre-johan"); selected = { kind: "wall", who: ME }; renderInfo(); return;
  } else if (kind === "quests") {
    title.textContent = "Quêtes de la semaine"; body.innerHTML = renderQuests();
  } else if (kind === "me") {
    title.textContent = "Ma présence"; body.innerHTML = renderPresenceForm(); bindPresence(body);
  }
  document.getElementById("modal").hidden = false; document.getElementById("scrim").hidden = false;
  document.getElementById("modalClose").focus();
}
function closeModal() { document.getElementById("modal").hidden = true; document.getElementById("scrim").hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function shownShort(w) { const p = S.presence[w]; if (!p.share) return "au calme"; return { dispo: "disponible", focus: "en focus", reunion: "en réunion" }[p.state]; }
function bindPresence(root) {
  const st = root.querySelector("#myState"), sh = root.querySelector("#myShare");
  st && st.addEventListener("change", () => { S.presence[ME].state = st.value; log(`Johan passe « ${shownShort(ME)} ».`, ME); save(); refreshRoom(); renderAll(); });
  sh && sh.addEventListener("change", () => { S.presence[ME].share = sh.checked; save(); refreshRoom(); renderAll(); });
}

  document.getElementById("presence").innerHTML = Object.keys(PEOPLE).map((w) => `<button type="button" class="chip" data-who="${w}"><span class="dot" style="background:${PEOPLE[w].shirt}">${PEOPLE[w].name[0]}</span><b>${PEOPLE[w].name}</b>${shownShort(w)}</button>`).join("");

  const pc = S.handoffs.filter((h) => h.to === ME && h.status === "pending").length;
  const pcEl = document.getElementById("postitCount"); pcEl.textContent = pc; pcEl.hidden = !pc;
}
function renderObjects() {
  const box = document.getElementById("objects");
  const seen = new Set();
  const refs = [];
  (room.wall_items || []).concat(room.items).forEach((it) => { if (it.ref) refs.push(it.ref); });
  room.avatars.forEach((a) => refs.push(a.ref || { kind: "person", who: a.who }));
  box.innerHTML = refs.filter((r) => { const k = JSON.stringify(r); if (seen.has(k)) return false; seen.add(k); return true; }).map((r) => {
    let l = labelFor(r);
    if (r.kind === "opp") l = oppById(r.id).client + " · " + STAGES[oppById(r.id).stage];
    if (r.kind === "signal") l = sigById(r.id).client + " sonne";
    if (r.kind === "task") l = taskById(r.id).title;
    if (r.kind === "person") l = PEOPLE[r.who].name;
    if (r.kind === "door") l = "Porte : " + ({ commune: "salle commune", hall: "hall clients", nav: "navigateur", dehors: "dehors" })[r.to];
    return `<button type="button" data-ref='${esc(JSON.stringify(r))}'>${esc(l)}</button>`;
  }).join("");
  box.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => select(JSON.parse(b.dataset.ref))));
}
function renderMissions() {
  document.getElementById("missions").innerHTML = MISSIONS.map(([id, text]) => `<div class="mission ${S.missions[id] ? "ok" : ""}"><span class="box">${S.missions[id] ? "✓" : ""}</span><span>${esc(text)}</span></div>`).join("")
    + `<p class="small muted">${Object.keys(S.missions).length}/${MISSIONS.length} · les réponses de Charles et Pierre sont simulées pour la démo.</p>`;
}
function renderFeed() {

  f.innerHTML = S.feed.map((e) => `<div class="row"><span class="mini" style="background:${e.who ? PEOPLE[e.who].shirt : "#ffc933"}">${e.who ? PEOPLE[e.who].name[0] : "•"}</span><div class="grow">${esc(e.text)}</div></div>`).join("") || '<p class="muted small">Tout ce qui se passe dans le QG s\'écrit ici : rien ne se perd dans une conversation.</p>';
}
function renderAll() { renderPresence(); renderMissions(); renderFeed(); renderInfo(); }

/* --- Chat / stand-up --- */
document.getElementById("chat").addEventListener("submit", (e) => {
  e.preventDefault();
  const kind = document.getElementById("chatKind").value, inp = document.getElementById("chatText");
  const text = inp.value.trim();
  if (!text) { inp.focus(); return; }
  if (kind === "note") {
    const r = selected;
    const label = r && r.kind === "task" ? `la tâche « ${taskById(r.id).title} »` : r && r.kind === "opp" ? `${oppById(r.id).client} (${oppById(r.id).title})` : null;
    if (!label) return toast("Choisis d'abord un objet", "Une note s'attache à une tâche ou à un client : clique-le dans une pièce, puis écris. Rien ne se perd dans un fil de discussion.");
    say(ME, text);
    log(`Note de Johan sur ${label} : ${text}`, ME);
    const mentioned = Object.keys(PEOPLE).find((w) => w !== ME && text.toLowerCase().includes("@" + w));
    if (mentioned) toast("Mention", `${PEOPLE[mentioned].name} est prévenu${S.presence[mentioned].state === "focus" ? " à la fin de son focus" : ""}.`);
    inp.value = ""; save(); renderAll(); return;
  }
  say(ME, text);
  {
    S.standup = S.standup.filter((s) => !(s.who === ME && s.kind === kind)).concat([{ who: ME, kind, text }]);
    log(`Stand-up de Johan (${kind === "bloque" ? "bloqué" : "aujourd'hui"}) : ${text}`, ME);
    mission("standup");
    if (kind === "bloque") {
      S.help.push({ id: "help" + Date.now(), who: ME, text, status: "open" });
      toast("Demande d'aide créée", "Ton « bloqué » apparaît dans la salle commune et sur le mur des autres.");
      after(3500, () => { const h = S.help.find((x) => x.who === ME && x.status === "open" && x.text === text); if (h) { h.status = "taken"; h.by = "pierre"; say("pierre", "Je regarde ça après ma session de focus. (réponse simulée)"); log("Pierre prend ta demande d'aide.", "pierre"); } });
    }
  }
  inp.value = ""; save(); refreshRoom(); renderAll();
});

document.getElementById("chatKind").addEventListener("change", (e) => {
  const inp = document.getElementById("chatText");
  if (inp.value.trim()) return;
  const doing = deskOf(ME).filter((t) => t.status === "doing").map((t) => t.title);
  const bl = deskOf(ME).find((t) => t.status === "blocked");
  if (e.target.value === "aujourdhui") inp.value = doing.length ? `Je termine ${doing.join(" et ")}.` : "";
  if (e.target.value === "bloque") inp.value = bl ? `${bl.title} : ${bl.reason || "j'ai besoin d'un avis"}.` : "";
  if (e.target.value === "note") inp.placeholder = "Note sur la tâche ou le client sélectionné (@charles pour le prévenir)";
  else inp.placeholder = "Dire quelque chose à l'équipe…";
});

/* --- Outils --- */
document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => openModal(b.dataset.open)));
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("scrim").addEventListener("click", closeModal);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.getElementById("modal").hidden) closeModal(); });
document.getElementById("resetDemo").addEventListener("click", () => {
  S = freshState(); save(); enterRoom("chambre-johan"); renderAll();
  document.getElementById("chatlog").innerHTML = "";
  toast("Démo remise à zéro", "Tout est revenu à l'état de départ.");
});

/* --- Démarrage --- */
window.addEventListener("resize", fit);
enterRoom(currentRoomId);
fit();
renderAll();
if (!S.feed.length) {
  log("Pierre passe « en focus » : montage du clip jusqu'à 11 h 30.", "pierre");
  log("Charles dépose un post-it sur ton mur : relire le deck Café Lumen.", "charles");
}
setTimeout(() => say("charles", "Johan, je t'ai laissé un post-it sur ton mur pour le deck Café Lumen."), 900);
requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutTags());
</script>
